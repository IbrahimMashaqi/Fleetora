# Use with docker-compose.yml. Neon migrations are an explicit operator action.
services:
  mailpit:
    profiles: [local]
  db:
    profiles: [local]
  migrate:
    profiles: [local]
  backend:
    depends_on: !reset {}
    env_file:
      - path: ./backend/.env
    # Replace the local environment map so it cannot mask env_file's DATABASE_URL.
    environment: !override
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:3000}
      FLEETORA_CLIENT_SOURCE_SECRET: ${FLEETORA_CLIENT_SOURCE_SECRET:?set FLEETORA_CLIENT_SOURCE_SECRET in .env}
      SIGNIN_RATE_LIMIT_KEY: ${SIGNIN_RATE_LIMIT_KEY:-}
