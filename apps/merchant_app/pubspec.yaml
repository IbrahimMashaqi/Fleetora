name: fleetora_merchant
description: Fleetora merchant operations application.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  json_annotation: ^4.12.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  maplibre: ^0.3.6
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
